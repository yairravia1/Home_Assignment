services:
  mongo:
    image: mongo:7
    container_name: homeassignment-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: homeassignment-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mongo_data:

